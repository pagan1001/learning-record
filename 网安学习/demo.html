<!DOCTYPE html> <!--文档声明，声明web浏览器使用的html版本-->
<html>
    <head>
        <meta charstr = 'UTF-8'> <!--声明本页使用UTF-8编码，避免乱码-->
        <title>Demo</title>
    </head>
    <body>
        <!--1、段落标签-->
        <p>文本</p>

        <!--2、超链接标签 href用于指定跳转链接，target用于指定跳转方式-->
        <a href="https://www.baidu.com" target="_blank">百度一下</a>

        <!--3、图片标签-->
        <img src="图片地址.jpg" alt="图片加载失败" title=""/>

        <!--4、布局标签-->
        <!--div块级标签；属于容器级的标签，div标签定义一个域；加上css样式，实现网页布局重构-->
        <!--Span行级标签：属于文本级标签，只能存放文本，图片，表单元素--> 
        <form>

        </form>
    </body>
</html>
